# seo-stat location blocks to be included inside the existing HTTPS server
# block for 192.168.8.50 (the site that already owns https://192.168.8.50/).
#
# The administrator bootstrap installs this file to
# /etc/nginx/snippets/seo-stat.locations.conf and adds
#   include /etc/nginx/snippets/seo-stat.locations.conf;
# to the server block. `proxy_pass` has no path component, so the full
# /seo-stat/... path is preserved.

# API requests go to NestJS, preserving the full path (/seo-stat/api/...).
location /seo-stat/api/ {
    proxy_pass http://127.0.0.1:3011;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    120s;
}

# Everything else under /seo-stat/ goes to Next.js, preserving the path.
location /seo-stat/ {
    proxy_pass http://127.0.0.1:3012;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout    120s;
}

# Canonical redirect: /seo-stat -> /seo-stat/
location = /seo-stat {
    return 301 /seo-stat/;
}
