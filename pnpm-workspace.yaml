packages:
  - "apps/*"

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@swc/core': true
  '@prisma/engines': true
  prisma: true
  unrs-resolver: true
  # Published packages ship prebuilt output; their install scripts are not run.
  '@google/genai': false
  protobufjs: false

minimumReleaseAgeExclude:
  - openai@7.30.1
